study:
  title: "Performance and Scalability Evaluation of Distributed Deep Learning Using Hadoop and Apache Spark"
  dataset: "UCI HIGGS"
  question: "How does increasing distributed worker count affect training time, speedup, scaling efficiency, and predictive performance when Spark orchestrates distributed PyTorch training over HDFS?"

# Locked before empirical benchmarking. No result values are stored here.
workers:
  candidate: [1, 2, 4, 8]
  rule: "Run only levels supported reliably by the validated target environment."

training_rows:
  candidate: [1000000, 2500000, 5000000, 10000000]
  rule: "Training subsets are drawn only from the fixed 10,000,000-row training partition."
validation_rows: 500000
test_rows: 500000

data_split:
  source_rows: 11000000
  training_rows: 10000000
  validation_rows: 500000
  official_test_rows: 500000
  rule: "The UCI final 500,000 observations are preserved as test; the preceding 10,500,000 are split into 10,000,000 training and 500,000 validation by the repository preparation script."
  seed: 42

model:
  type: "feed_forward_binary_classifier"
  input_features: 28
  hidden_layers: [128, 64]
  activation: "ReLU"
  output: 1
  loss: "BCEWithLogitsLoss"
  optimizer: "Adam"
  learning_rate: 0.001
  global_batch_size: 1024
  epochs: 5
  seed: 42
  preprocessing: "none unless a pre-benchmark pilot establishes a fixed, leakage-free transform; no per-worker tuning"
  batch_control: "Keep global batch size fixed; local_batch_size = global_batch_size / workers."

execution:
  orchestration: "Apache Spark 3.5.9"
  training: "PyTorch DistributedDataParallel"
  distributor: "TorchDistributor._train_on_dataframe"
  storage: "HDFS"
  prepared_format: "Parquet"
  scaling_design: "strong_scaling"
  scaling_rule: "At a fixed training-data volume, worker-count comparisons increase available Spark task parallelism/resources while keeping model, data, global batch, epochs, software, and storage representation fixed. The benchmark must run with at least one schedulable CPU core per TorchDistributor process and record the actual resource allocation."
  resource_gate: "Do not accept a worker-count run unless the validated environment can concurrently schedule the requested number of Spark tasks without intentional oversubscription; record spark master, default parallelism, executor cores/instances, memory, and dynamic-allocation settings."
  baseline: "1-worker TorchDistributor run using the identical HDFS split, model, optimizer, global batch size, epoch budget, timing boundary, and software environment"
  secondary_baseline: "Native single-process PyTorch may be evaluated only as a separately labelled comparison; it is not the primary speedup denominator"

metrics:
  primary:
    - distributed_training_wall_clock_seconds
    - examples_per_second
    - speedup_vs_1_worker
    - scaling_efficiency
  predictive:
    - training_loss
    - validation_loss
    - validation_roc_auc
    - validation_accuracy
    - test_loss
    - test_roc_auc
    - test_accuracy
  secondary:
    - job_wall_clock_seconds
    - synchronized_max_worker_training_seconds
    - resource_utilization_when_reliable

repetitions:
  target: 3
  minimum_rule: "Use at least three retained runs per condition where feasible; otherwise report the limitation and avoid overstating stability."

integrity:
  fabricate_results: false
  fabricate_citations: false
  fabricate_dataset_values: false
  require_retained_run_artifact: true
  require_environment_metadata: true
  preserve_official_test_set: true
  no_hyperparameter_tuning_by_worker_count: true
  no_result_without_run_artifact: true
